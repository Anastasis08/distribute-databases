[project]
name = "product-consumer"
version = "1.0.0"
description = "Consumer service: reads product events from Kafka and upserts them into MongoDB."
requires-python = ">=3.12"
dependencies = [
    "product-contracts",
    "confluent-kafka>=2.11,<3",
    "pymongo>=4.10,<5",
    "pydantic-settings>=2.6,<3",
]

[project.scripts]
product-consumer = "consumer_service.__main__:main"

[tool.uv.sources]
product-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consumer_service"]
