# uv workspace: shared message contract + two independent services.
[tool.uv.workspace]
members = ["libs/contracts", "services/producer", "services/consumer"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -ra"
testpaths = ["libs/contracts/tests", "services/producer/tests", "services/consumer/tests"]
markers = ["integration: requires the docker compose stack (MongoDB) to be running"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C4", "RET", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["product_contracts", "producer_service", "consumer_service"]
