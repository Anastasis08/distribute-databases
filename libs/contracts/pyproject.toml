[project]
name = "product-contracts"
version = "1.0.0"
description = "Kafka message contract (ProductEvent) shared by the producer and consumer services."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_contracts"]
