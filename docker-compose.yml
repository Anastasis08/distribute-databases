name: product-sync

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-kafka-image: &kafka-image apache/kafka:${KAFKA_VERSION:-4.3.1}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalog_pwd}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  kafka:
    image: *kafka-image
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/29092' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    logging: *logging

  kafka-init:
    image: *kafka-image
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCTS_TOPIC: ${KAFKA_TOPIC:-products}
      PRODUCTS_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-products.dlq}
      KAFKA_HEAP_OPTS: -Xmx256m
    volumes:
      - ./infra/kafka/create-topics.sh:/opt/init/create-topics.sh:ro
    entrypoint: ["bash", "/opt/init/create-topics.sh"]
    restart: "no"
    logging: *logging

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root_pwd}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-product_catalog}
      MONGO_APP_DATABASE: ${MONGO_DATABASE:-product_catalog}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-sync_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-sync_app_pwd}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging: *logging

  producer:
    build:
      context: .
      dockerfile: services/producer/Dockerfile
    image: product-sync/producer:1.0.0
    environment:
      PRODUCER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-catalog}:${POSTGRES_PASSWORD:-catalog_pwd}@postgres:5432/${POSTGRES_DB:-catalog}
      PRODUCER_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCER_KAFKA_TOPIC: ${KAFKA_TOPIC:-products}
      PRODUCER_POLL_INTERVAL_SECONDS: ${PRODUCER_POLL_INTERVAL_SECONDS:-2}
      PRODUCER_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *logging

  consumer:
    build:
      context: .
      dockerfile: services/consumer/Dockerfile
    image: product-sync/consumer:1.0.0
    environment:
      CONSUMER_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CONSUMER_KAFKA_TOPIC: ${KAFKA_TOPIC:-products}
      CONSUMER_KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-products.dlq}
      CONSUMER_MONGO_URI: mongodb://${MONGO_APP_USERNAME:-sync_app}:${MONGO_APP_PASSWORD:-sync_app_pwd}@mongo:27017/${MONGO_DATABASE:-product_catalog}?authSource=${MONGO_DATABASE:-product_catalog}
      CONSUMER_MONGO_DATABASE: ${MONGO_DATABASE:-product_catalog}
      CONSUMER_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *logging

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: ["ui"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: product-sync
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"
    restart: unless-stopped
    logging: *logging

  mongo-express:
    image: mongo-express:1.0.2
    profiles: ["ui"]
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-root_pwd}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    restart: unless-stopped
    logging: *logging

  adminer:
    image: adminer:5.5.1
    profiles: ["ui"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    restart: unless-stopped
    logging: *logging

volumes:
  postgres-data:
  kafka-data:
  mongo-data:
